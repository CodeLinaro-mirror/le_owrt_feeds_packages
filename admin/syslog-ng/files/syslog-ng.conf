# syslog-ng configuration — default/fallback configuration
# This file is overwritten at runtime by: /usr/sbin/syslog-ng-config generate
# To make persistent changes, edit /etc/config/syslog-ng and run:
#   syslog-ng-config apply
#
# See https://www.syslog-ng.com/technical-documents/list/syslog-ng-open-source-edition

@version: current
@include "scl.conf"

options {
	chain_hostnames(no); # Enable or disable the chained hostname format.
	create_dirs(yes);
	keep_hostname(yes); # Enable or disable hostname rewriting.
	log_fifo_size(256); # The number of messages that the output queue can store.
	log_msg_size(1024); # Maximum length of a message in bytes.
	stats(freq(0)); # The period between two STATS messages (sent by syslog-ng, containing statistics about dropped logs) in seconds.
	flush_lines(0); # How many lines are flushed to a destination at a time.
	use_fqdn(no); # Add Fully Qualified Domain Name instead of short hostname.
	keep_timestamp(no);
	threaded(no);
};

# ── Default sources ───────────────────────────────────────────────────────────

source src {
	internal();
	unix-dgram("/dev/log");
};

source kernel {
	file("/proc/kmsg" program_override("kernel"));
};

# ── Default destination ───────────────────────────────────────────────────────

destination messages {
	file("/var/log/messages");
};

# ── Default log rule — always present, never removed ─────────────────────────
# All messages from all sources go to /var/log/messages.
# Per-subsystem filters added via syslog-ng-config are appended below this rule.

log {
	source(src);
	source(kernel);
	destination(messages);
};

# ── Custom drop-in configurations ────────────────────────────────────────────
@include "/etc/syslog-ng.d/"